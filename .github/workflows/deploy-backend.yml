name: Deploy Backend & AI Services to GCP

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for authenticating with GCP via Workload Identity Federation

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # --- 1. DEPLOY PYTHON AI SERVICE ---
      - name: Build and Push Python AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/fraymly-repo/ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Python AI Service to Cloud Run
        id: deploy-ai
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fraymly-ai-service
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/fraymly-repo/ai-service:latest
          flags: |
            --allow-unauthenticated
            --memory=8Gi
            --cpu=4
            --timeout=3600
            --min-instances=1
            --max-instances=5
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
            WHISPER_MODEL=large-v3-turbo

      # --- 2. DEPLOY NODE.JS API BACKEND ---
      - name: Build and Push Node.js API Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/fraymly-repo/api-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Node.js API Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fraymly-api-backend
          region: ${{ env.GCP_REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/fraymly-repo/api-backend:latest
          flags: |
            --allow-unauthenticated
            --memory=2Gi
            --cpu=1
            --min-instances=1
            --max-instances=10
          env_vars: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            STORAGE_DRIVER=gcs
            AI_SERVICE_URL=${{ steps.deploy-ai.outputs.url || 'https://fraymly-ai-service-dummy-url' }}
            API_URL=https://fraymly-api-backend-dummy-url/api/internal